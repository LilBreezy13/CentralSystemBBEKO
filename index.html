  const fieldMap = {
    fullName:"sf-fullname",gender:"sf-gender",dob:"sf-dob",
    nationality:"sf-nationality",ghanaCard:"sf-ghana-card",ssnit:"sf-ssnit",
    nhis:"sf-nhis",maritalStatus:"sf-marital",homeTown:"sf-hometown",
    residentialAddress:"sf-address",mobile:"sf-mobile",emergencyContact:"sf-emergency-contact",
    gpsAddress:"sf-gps",personalEmail:"sf-email",dateOfExit:"sf-exit-date",status:"sf-emp-record-status",
    employmentDate:"sf-employment-date",confirmationDate:"sf-confirm-date",
    branch:"sf-branch",department:"sf-department",position:"sf-position",
    employmentStatus:"sf-emp-status",reportingOfficer:"sf-reporting-officer",
    salary:"sf-salary",bankName:"sf-bank-name",bankAccount:"sf-bank-account",bankBranch:"sf-bank-branch",
    highestQualification:"sf-qualification",institutionAttended:"sf-institution",
    programStudied:"sf-program",yearCompleted:"sf-year",professionalCerts:"sf-certs",
    bloodGroup:"sf-blood-group",nhisExpiry:"sf-nhis-expiry",
    medicalConditions:"sf-medical-conditions",allergies:"sf-allergies",emergencyMedicalNotes:"sf-med-notes",
    nokName:"sf-nok-name",nokRelationship:"sf-nok-relationship",
    nokPhone:"sf-nok-phone",nokOccupation:"sf-nok-occupation",nokAddress:"sf-nok-address"
  };
  Object.entries(fieldMap).forEach(([key, id]) => {
    const el = document.getElementById(id);
    if (el) addStaffDraft[key] = el.value;
  });
  try { localStorage.setItem("bb_staff_draft", JSON.stringify(addStaffDraft)); } catch(e) {}
  updateFillCircle();
  updatePreviewBanner();
  const lbl = document.getElementById("autosave-label");
  if (lbl) { lbl.textContent = "Saved ✓"; setTimeout(() => { if(lbl) lbl.textContent = "Auto-saving…"; }, 1500); }
}
function updateFillCircle() {
  const rate = calcFillRate(addStaffDraft);
  const circle = document.getElementById("fill-circle");
  if (!circle) return;
  const col = rate >= 100 ? "var(--green)" : rate >= 80 ? "var(--blue)" : rate >= 50 ? "var(--amber)" : "var(--red)";
  circle.style.borderColor = col;
  circle.style.color = col;
  circle.style.background = col + "18";
  circle.textContent = rate + "%";
}

    "sf-fullname":"fullName","sf-gender":"gender","sf-dob":"dob",
    "sf-nationality":"nationality","sf-ghana-card":"ghanaCard","sf-ssnit":"ssnit",
    "sf-nhis":"nhis","sf-marital":"maritalStatus","sf-hometown":"homeTown",
    "sf-address":"residentialAddress","sf-mobile":"mobile",
    "sf-emergency-contact":"emergencyContact","sf-employment-date":"employmentDate",
    "sf-branch":"branch","sf-department":"department","sf-position":"position",
    "sf-emp-status":"employmentStatus","sf-reporting-officer":"reportingOfficer",
    "sf-confirm-date":"confirmationDate","sf-bank-name":"bankName",
    "sf-bank-account":"bankAccount","sf-bank-branch":"bankBranch",
    "sf-qualification":"highestQualification","sf-institution":"institutionAttended",

    "sf-nhis":"NHIS Number","sf-marital":"Marital Status","sf-hometown":"Home Town",
    "sf-address":"Residential Address","sf-mobile":"Mobile Number",
    "sf-emergency-contact":"Emergency Contact","sf-employment-date":"Date of Employment",
    "sf-branch":"Branch","sf-department":"Department","sf-position":"Position",

    "sf-confirm-date":"Confirmation Date","sf-bank-name":"Bank Name",

  });
  const barColor = rate>=100?"var(--green)":rate>=80?"var(--blue)":"var(--amber)";
  if (!missing.length) {

function updateTabStatuses() {
  FORM_SECTIONS.forEach((s, i) => {
    const el = document.getElementById("tab-status-" + i);
    if (!el) return;
    const required = REQUIRED_FIELDS[s.key] || [];
    if (!required.length) { el.textContent = ""; return; }
    const dataKeyMap = {

      "sf-nationality":"nationality","sf-ghana-card":"ghanaCard","sf-ssnit":"ssnit",
      "sf-nhis":"nhis","sf-marital":"maritalStatus","sf-hometown":"homeTown",
      "sf-address":"residentialAddress","sf-mobile":"mobile",
      "sf-emergency-contact":"emergencyContact","sf-employment-date":"employmentDate",
      "sf-branch":"branch","sf-department":"department","sf-position":"position",
      "sf-emp-status":"employmentStatus","sf-reporting-officer":"reportingOfficer",
      "sf-confirm-date":"confirmationDate","sf-bank-name":"bankName",
      "sf-bank-account":"bankAccount","sf-bank-branch":"bankBranch",
      "sf-qualification":"highestQualification","sf-institution":"institutionAttended",

/* ── Navigation ── */
function jumpToSection(idx) {
  saveDraft(); // save current before leaving
  addStaffSection = idx;
  // Rebuild modal with new section
  buildAddStaffModal();
  // Scroll form body to top
  const body = document.getElementById("add-staff-form-body");
  if (body) body.scrollTop = 0;
}

function formNext() {
  saveDraft();
  if (addStaffSection < FORM_SECTIONS.length - 1) jumpToSection(addStaffSection + 1);
}

function formPrev() {
  saveDraft();
  if (addStaffSection > 0) jumpToSection(addStaffSection - 1);
}

/* ── File handlers ── */
function handlePassportUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast("Photo must be under 2MB"); return; }
  addStaffFiles.passport = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById("passport-preview-img");
    const ph  = document.getElementById("passport-placeholder");
    if (img) { img.src = ev.target.result; img.style.display = "block"; }
    if (ph)  ph.style.display = "none";
    addStaffDraft._passportDataUrl = ev.target.result; // preview only
    updateFillCircle();
  };
  reader.readAsDataURL(file);
}

function handleDocUpload(e) {
  const files = Array.from(e.target.files);
  files.forEach(f => {
    if (f.size > 10 * 1024 * 1024) { showToast(`⚠️ ${f.name} exceeds 10MB limit`); return; }
    addStaffFiles.documents.push(f);
  });
  // Re-render the doc list
  const list = document.getElementById("doc-file-list");
  if (list) {
    list.innerHTML = addStaffFiles.documents.map((f,i)=>`<div class="doc-item">
      <span style="font-size:15px"></span>
      <span class="doc-item-name">${f.name}</span>
      <span class="doc-remove" onclick="removeDoc(${i})">✕</span>
    </div>`).join("") + (addStaffDraft.documentUrls||[]).map(d=>`<div class="doc-item">
      <span style="font-size:15px"></span>
      <span class="doc-item-name"><a href="${d.url}" target="_blank" style="color:var(--blue)">${d.name}</a></span>
    </div>`).join("");
  }
}

function removeDoc(idx) {
  addStaffFiles.documents.splice(idx, 1);
  const list = document.getElementById("doc-file-list");
  if (list) list.innerHTML = addStaffFiles.documents.map((f,i)=>`<div class="doc-item">
    <span></span><span class="doc-item-name">${f.name}</span>
    <span class="doc-remove" onclick="removeDoc(${i})">✕</span>
  </div>`).join("");
}

/* ── SUBMIT ── */
async function submitStaffForm() {
  // Step 1: collect all fields
  saveDraft();
  const rate = calcFillRate(addStaffDraft);

  if (rate < 80) {
    showToast("⚠️ Fill rate is " + rate + "%. Must be ≥ 80% to submit.");
    updatePreviewBanner();
    setTimeout(() => document.getElementById("staff-preview-banner")
      ?.scrollIntoView({ behavior:"smooth", block:"center" }), 100);
    return;
  }

  const submitBtn = document.querySelector('#add-staff-modal-root button[onclick="submitStaffForm()"]');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "Saving…"; }

  try {
    const fb = await staffDb();

    // ── Passport photo: try Storage, fall back to base64, fall back to nothing ──
    let passportUrl = addStaffDraft.passportPhotoUrl || "";

    if (addStaffFiles.passport) {
      if (fb) {
        // Try Storage upload with a 6-second timeout
        try {
          const storageResult = await Promise.race([
            (async () => {
              const { storage, ref, uploadBytes, getDownloadURL } = fb;
              const path    = `staff/passports/${Date.now()}_${addStaffFiles.passport.name}`;
              const fileRef = ref(storage, path);
              await uploadBytes(fileRef, addStaffFiles.passport);
              return await getDownloadURL(fileRef);
            })(),
            new Promise((_, reject) =>
              setTimeout(() => reject(new Error("Storage timeout")), 6000)
            )
          ]);
          passportUrl = storageResult; // real URL from Storage
        } catch(storageErr) {
          console.warn("Storage unavailable, using base64 fallback:", storageErr.message);
          // Fall back to base64 — photo still shows in profiles
          passportUrl = addStaffDraft._passportDataUrl || "";
        }
      } else {
        // No Firebase at all — use base64
        passportUrl = addStaffDraft._passportDataUrl || "";
      }
    }

    // ── Documents: try Storage, skip silently if unavailable ──
    let docUrls = [...(addStaffDraft.documentUrls || [])];

    if (fb && addStaffFiles.documents.length) {
      for (const file of addStaffFiles.documents) {
        try {
          const docResult = await Promise.race([
            (async () => {
              const { storage, ref, uploadBytes, getDownloadURL } = fb;
              const path    = `staff/documents/${Date.now()}_${file.name}`;
              const fileRef = ref(storage, path);
              await uploadBytes(fileRef, file);
              return { name: file.name, url: await getDownloadURL(fileRef) };
            })(),
            new Promise((_, reject) =>
              setTimeout(() => reject(new Error("Doc upload timeout")), 8000)
            )
          ]);
          docUrls.push(docResult);
        } catch(e) {
          console.warn("Doc skipped (Storage unavailable):", file.name);
          // Store filename only — URL will be added when Storage is set up
          docUrls.push({ name: file.name, url: "", pending: true });
        }
      }
    }

    // ── Build clean payload — strip internal draft-only keys ──
    const cleanData = {};
    Object.entries(addStaffDraft).forEach(([k, v]) => {
      if (k !== "_editId" && k !== "_passportDataUrl") {
        cleanData[k] = (v === "" || v === undefined) ? null : v;
      }
    });

    
    let finalPhotoUrl = passportUrl;
    if (finalPhotoUrl && finalPhotoUrl.startsWith("data:image")) {
      finalPhotoUrl = await compressToThumbnail(finalPhotoUrl, 200, 0.7);
    }

    const staffData = {
      ...cleanData,
      passportPhotoUrl: finalPhotoUrl || null,
      documentUrls:     docUrls,
      fillRate:         rate,
      status:           cleanData.status || "Active",
      _storageReady:    !!(passportUrl && !passportUrl.startsWith("data:")) // flag for later migration
    };

    const editId = addStaffDraft._editId || null;

    if (editId && fb) {
      await updateStaffInFirestore(editId, staffData);
      const idx = staffList.findIndex(s => s.id === editId);
      if (idx !== -1) staffList[idx] = { id: editId, ...staffData };
      showToast("✓ " + (staffData.fullName||"Staff") + " updated successfully");
    } else if (fb) {
      const newId = await saveStaffToFirestore(staffData);
      staffList.unshift({ id: newId, ...staffData });
      showToast("✓ " + (staffData.fullName||"Staff") + " added successfully");
    } else {
      const tempId = "local_" + Date.now();
      staffList.unshift({ id: tempId, ...staffData });
      showToast("✓ Saved locally (Firebase not connected)");
    }

    // Clean up
    localStorage.removeItem("bb_staff_draft");
    addStaffDraft = {};
    addStaffFiles = { passport: null, documents: [] };

    closeAddStaffModal();
    buildStaffPanel(document.getElementById("panel-staff"));

  } catch(err) {
    const msg = err?.message || err?.code || JSON.stringify(err);
    console.error("submitStaffForm error:", err);
    showToast("⚠️ Save failed: " + msg.slice(0, 80));
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = addStaffDraft._editId ? "Save Changes" : " Submit";
    }
  }
}

// Compress a base64 image to a small thumbnail for Firestore storage
function compressToThumbnail(dataUrl, maxSize, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const ratio  = Math.min(maxSize / img.width, maxSize / img.height, 1);
      canvas.width  = Math.round(img.width  * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => resolve(dataUrl); // if compression fails, use original
    img.src = dataUrl;
  });
}
function closeAddStaffModal() {
  document.getElementById("add-staff-modal-root").innerHTML = "";
}
